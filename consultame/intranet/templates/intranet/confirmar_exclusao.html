{% extends 'intranet/base_logado.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<main class="container">
  <section class="card form-card">
    <h2 class="title">{{ titulo }}</h2>
    <!-- "object" é o registro que a DeleteView buscou pelo <int:pk> da URL -->
    <p>Tem certeza de que deseja excluir <strong>{{ object }}</strong>? Essa ação não pode ser desfeita.</p>

    <!-- A DeleteView só apaga com POST (um link GET nunca apaga nada) -->
    <form method="post">
      {% csrf_token %}
      <div class="buttons">
        <button type="submit" class="btn btn-perigo">Sim, excluir</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
