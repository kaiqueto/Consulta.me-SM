{% extends 'intranet/base_logado.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<main class="container">
  <section class="card form-card">
    <h2 class="title">{{ titulo }}</h2>

    <form method="post">
      {% csrf_token %}
      {% include 'intranet/_campos.html' %}

      <div class="buttons">
        <button type="submit" class="btn btn-primary">Emitir receita</button>
        <a href="{% url 'intranet:receita-list' %}" class="btn btn-secondary">Voltar</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
